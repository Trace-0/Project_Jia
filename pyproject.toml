[project]
name = "project-jia"
version = "1.2.0"
description = "디스코드에서 음성/텍스트로 대화하는 AI 친구 지아"
readme = "README.md"
license = { file = "LICENSE" }
# 코드에서 audioop을 직접 쓰므로 3.13 이상에서는 동작하지 않습니다. 배포본과 같은 3.10으로 고정합니다.
requires-python = "==3.10.*"
dependencies = [
    # PyTorch는 아래 [tool.uv.sources]에서 CUDA 12.6 빌드로 받습니다.
    "torch==2.7.1",
    "torchaudio==2.7.1",
    # 디스코드
    "discord.py[voice]>=2.7.1,<2.8",
    "davey>=0.1.5",
    "PyNaCl>=1.5",
    # 설정
    "python-dotenv>=1.1",
    "tomlkit>=0.13",
    # LLM
    "langchain>=0.3.27,<0.4",
    "langchain-community>=0.3.27,<0.4",
    "langchain-core>=0.3.74,<0.4",
    "langchain-mcp-adapters>=0.1.9,<0.2",
    "mcp>=1.12,<2",
    "langchain-ollama>=0.3.6,<0.4",
    "langgraph>=0.6.4,<0.7",
    "ollama>=0.5,<0.6",
    "pydantic>=2",
    "dataclasses-json",
    "requests",
    # 기억(RAG)
    "faiss-cpu>=1.11,<2",
    "sentence-transformers>=5.0,<6",
    "scikit-learn>=1.7,<2",
    "pandas>=2.3,<2.4",
    # 음성 인식/합성
    "numpy>=2.0,<3",
    "scipy>=1.10",
    "soundfile>=0.13",
    "faster-whisper>=1.2.1,<1.3",
    "transformers>=5.0,<5.1",
    "huggingface-hub>=1.3,<1.4",
    "onnxruntime>=1.20,<2",
    "espnet>=202509,<202600",
    "espnet-model-zoo>=0.1.7",
    # TTS 모델의 g2p(korean_jaso)에 필요
    "jamo>=0.4.1",
    "protobuf>=6,<7",
    # 음악
    "yt-dlp>=2026.6.9",
    # 기본 검색 MCP 서버를 실행하는 uvx
    "uv",
]

[tool.uv]
# 설치할 패키지가 아니라 실행하는 앱이므로 프로젝트 자체는 빌드하지 않습니다.
package = false
# Windows와 Linux(도커 포함)만 지원합니다. (macOS는 CUDA가 없어 음성 인식 기본 설정으로 동작하지 않음)
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
